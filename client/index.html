<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" />
    <meta name="description" content="SMUhub, the private home of SMU students: course files, Q&amp;A, Campus Voice, events and rentals." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SMUhub</title>
    <script>
      try {
        var t = localStorage.getItem('smuhub.theme'), d = document.documentElement, m = document.querySelector('meta[name=theme-color]');
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) d.classList.add('dark');
        var sync = function () { m.content = d.classList.contains('dark') ? '#10161d' : '#f6f8fa'; };
        sync(); new MutationObserver(sync).observe(d, { attributes: true, attributeFilter: ['class'] });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
